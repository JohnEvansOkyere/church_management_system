# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo (or paste this file).
#
# After first deploy:
# 1. Set DATABASE_URL (Render PostgreSQL or Supabase).
# 2. Set SECRET_KEY (long random string).
# 3. Set CORS_ORIGINS to your Vercel URL(s), comma-separated, e.g.:
#    https://your-app.vercel.app,https://your-app-git-main-yourteam.vercel.app
# 4. Run migrations if preDeployCommand did not run: render shell → cd backend → alembic upgrade head

services:
  - type: web
    name: living-spring-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations before traffic switches to new release (requires DB env vars on Render)
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SMS_PROVIDER
        value: arkesel
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        value: LivingSpring
      - key: ARKESEL_BASE_URL
        value: https://sms.arkesel.com
      - key: MOOLRE_VAS_KEY
        sync: false
      - key: MOOLRE_SENDER_ID
        value: LivingSpring
      - key: MOOLRE_BASE_URL
        value: https://api.moolre.com

  # Render cron jobs run in UTC. The reminder worker converts each schedule
  # to its configured timezone (Africa/Accra by default) before sending.
  # Cron jobs require a paid Render plan; use an external cron service if
  # you prefer to keep the web service on the free plan.
  - type: cron
    name: living-spring-reminders
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_reminders.py
    schedule: "*/10 * * * *"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SMS_PROVIDER
        value: arkesel
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        value: LivingSpring
      - key: ARKESEL_BASE_URL
        value: https://sms.arkesel.com
      - key: MOOLRE_VAS_KEY
        sync: false
      - key: MOOLRE_SENDER_ID
        value: LivingSpring
      - key: MOOLRE_BASE_URL
        value: https://api.moolre.com
